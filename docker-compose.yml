services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newsbot
      POSTGRES_USER: newsbot
      POSTGRES_PASSWORD: newsbot
    ports:
      - "5432:5432"
    volumes:
      - newsbot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - newsbot-redis:/data

volumes:
  newsbot-postgres:
  newsbot-redis:
