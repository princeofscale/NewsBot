services:
  init:
    build: .
    env_file: .env
    environment:
      NEWSBOT_DATABASE_URL: postgresql+asyncpg://newsbot:${NEWSBOT_POSTGRES_PASSWORD:?set NEWSBOT_POSTGRES_PASSWORD}@postgres:5432/newsbot
    command: >
      sh -c "uv run --no-sync alembic upgrade head &&
      uv run --no-sync newsbot sources-sync"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    env_file: .env
    environment:
      NEWSBOT_DATABASE_URL: postgresql+asyncpg://newsbot:${NEWSBOT_POSTGRES_PASSWORD:?set NEWSBOT_POSTGRES_PASSWORD}@postgres:5432/newsbot
    command: uv run --no-sync newsbot worker
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build: .
    env_file: .env
    environment:
      NEWSBOT_DATABASE_URL: postgresql+asyncpg://newsbot:${NEWSBOT_POSTGRES_PASSWORD:?set NEWSBOT_POSTGRES_PASSWORD}@postgres:5432/newsbot
    command: uv run --no-sync newsbot serve --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: newsbot
      POSTGRES_USER: newsbot
      POSTGRES_PASSWORD: ${NEWSBOT_POSTGRES_PASSWORD:?set NEWSBOT_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - newsbot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsbot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${NEWSBOT_POSTGRES_PASSWORD:?set NEWSBOT_POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        set -eu;
        while true; do
        stamp=$$(date -u +%Y%m%dT%H%M%SZ);
        tmp=/backups/.newsbot-$$stamp.tmp;
        pg_dump -h postgres -U newsbot -Fc newsbot -f $$tmp;
        mv $$tmp /backups/newsbot-$$stamp.dump;
        find /backups -type f -mtime +14 -delete;
        sleep 86400;
        done
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  newsbot-postgres:
