[project]
name = "saratov-newsbot"
version = "0.1.0"
description = "Autonomous Saratov news aggregation pipeline"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "feedparser>=6.0",
  "httpx>=0.28",
  "openai>=1.60",
  "prometheus-client>=0.21",
  "pydantic-settings>=2.7",
  "pyrofork>=2.3.60",
  "pyromax>=0.7.1",
  "sqlalchemy[asyncio]>=2.0.37",
  "structlog>=24.4",
  "tenacity>=9.0",
  "typer>=0.15",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "respx>=0.22",
  "ruff>=0.9",
]

[project.scripts]
newsbot = "newsbot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
packages = ["newsbot"]
